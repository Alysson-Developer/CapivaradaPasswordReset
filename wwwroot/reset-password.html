<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <meta
            name="referrer"
            content="no-referrer"
    >

    <title>Redefinir senha — Capivarada</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            color: white;

            background:
                    radial-gradient(
                            circle at top,
                            #087A3E 0%,
                            #062E1B 55%,
                            #031B10 100%
                    );
        }

        .card {
            width: 100%;
            max-width: 480px;

            padding: 42px;

            background: #0B4D2A;

            border-radius: 24px;

            border-top: 7px solid #F7D117;

            box-shadow:
                    0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;

            margin-bottom: 30px;

            font-size: 30px;
            font-weight: 900;

            color: #F7D117;
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #087A3E;

            font-size: 34px;
        }

        h1 {
            margin: 0;

            text-align: center;

            font-size: 30px;
        }

        .description {
            margin: 12px 0 30px;

            text-align: center;

            line-height: 1.6;

            color: #DDF5E7;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;

            color: #DDF5E7;
        }

        input[type="password"] {
            width: 100%;

            padding: 15px 16px;

            border: 2px solid #176B42;

            border-radius: 10px;

            outline: none;

            background: #063B20;

            color: white;

            font-size: 16px;

            transition:
                    border-color 0.2s,
                    box-shadow 0.2s;
        }

        input[type="password"]:focus {
            border-color: #F7D117;

            box-shadow:
                    0 0 0 3px rgba(247, 209, 23, 0.15);
        }

        input[type="password"]::placeholder {
            color: #8DB49D;
        }

        .requirements {
            margin-top: 8px;

            font-size: 12px;

            color: #8DB49D;
        }

        button {
            width: 100%;

            margin-top: 10px;

            padding: 16px;

            border: none;

            border-radius: 10px;

            background: #F7D117;

            color: #063B20;

            font-size: 16px;
            font-weight: 900;

            cursor: pointer;

            transition:
                    transform 0.15s,
                    filter 0.15s;
        }

        button:hover {
            filter: brightness(1.08);

            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 25px;

            text-align: center;

            font-size: 12px;

            line-height: 1.5;

            color: #8DB49D;
        }

        @media (max-width: 520px) {

            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

<main class="card">

    <div class="logo">
        CAPIVARADA
    </div>

    <div class="icon">
        🔑
    </div>

    <h1>
        Redefinir senha
    </h1>

    <p class="description">
        Crie uma nova senha para voltar a jogar no Capivarada!
    </p>

    <form method="POST" action="/api/password/reset">

        <input
                type="hidden"
                name="token"
                value="{{RECOVERY_TOKEN}}"
        >

        <div class="field">

            <label for="password">
                Nova senha
            </label>

            <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Digite sua nova senha"
                    required
                    minlength="6"
                    autocomplete="new-password"
            >

            <div class="requirements">
                Mínimo de 6 caracteres.
            </div>

        </div>

        <div class="field">

            <label for="confirmPassword">
                Confirmar nova senha
            </label>

            <input
                    id="confirmPassword"
                    type="password"
                    name="confirmPassword"
                    placeholder="Digite a senha novamente"
                    required
                    minlength="6"
                    autocomplete="new-password"
            >

        </div>

        <button type="submit">
            ALTERAR SENHA
        </button>

    </form>

    <div class="footer">
        Depois de alterar a sua senha, volte para o Capivarada e faça login normalmente.
    </div>

</main>

</body>

</html>
